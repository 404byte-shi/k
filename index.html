<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <meta name="theme-color" content="#05030d" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌍</text></svg>" />
  <title>For Her — 20 ❤️</title>

  <link rel="stylesheet" href="./style.css" />

  <!-- Three.js -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
  </script>
</head>

<body>

  <div id="app"></div>
  <div id="fade"></div>

  <!-- UI -->
  <div class="hud">

    <header>
      <div class="brand">
        FOR HER · 20
      </div>

      <div id="chapter">
        01 · THE UNIVERSE
      </div>
    </header>

    <button id="back" class="glass back">
      ← Back
    </button>

    <section class="story">

      <div id="eyebrow">
        A LITTLE UNIVERSE
      </div>

      <h1 id="title">
        Find HER.
      </h1>

      <p id="description">
        A brighter little universe made for the girl
        who turns distance into something beautiful.
      </p>

      <button id="action" class="glass primary">
        Begin the journey ✦
      </button>

    </section>

    <div id="hint" class="hint">
      Drag · pinch · tap objects
    </div>

    <div id="toast" class="toast"></div>

    <div id="emote" class="emote"></div>

  </div>

  <script>
    function show(m) {
      let d = document.getElementById("err");
      if (!d) { d = document.createElement("pre"); d.id = "err"; d.style.cssText = "position:fixed;left:12px;right:12px;top:70px;z-index:99;padding:12px;background:#3a0010;color:#ffc2cf;font:12px monospace;white-space:pre-wrap;border-radius:8px"; document.body.appendChild(d); }
      d.textContent += m + "
";
    }
    addEventListener("error", e => show("Error: " + (e.message || "script failed")));
    addEventListener("unhandledrejection", e => show("Error: " + e.reason));
  </script>
  <script type="module" src="./main.js" onerror="show('main.js could not load (check file name / three.js import)')"></script>

</body>
</html>
