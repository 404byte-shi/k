<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta
    name="theme-color"
    content="#02030b"
  >

  <title>For Her · 20 ❤️</title>

  <link rel="stylesheet" href="./style.css">

  <!--
    Import map allows OrbitControls to resolve "three"
    directly in the browser without Vite/npm.
  -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
  }
  </script>
</head>

<body>

  <div id="app"></div>

  <!-- UI -->

  <div class="interface">

    <header class="top-bar">

      <div class="brand">
        FOR HER · 20
      </div>

      <div
        id="chapter"
        class="chapter"
      >
        01 · THE UNIVERSE
      </div>

    </header>


    <button
      id="backButton"
      class="back-button"
      aria-label="Go back"
    >
      ← Back
    </button>


    <section class="story">

      <div
        id="eyebrow"
        class="eyebrow"
      >
        CHAPTER ONE
      </div>

      <h1 id="title">
        Somewhere in the universe…
      </h1>

      <p id="description">
        Two people can be far apart
        and still belong to the same
        little universe.
      </p>

      <button
        id="actionButton"
        class="action-button"
      >
        Begin the journey ✦
      </button>

    </section>


    <div
      id="interactionHint"
      class="interaction-hint"
    >
      Drag · pinch · tap HER
    </div>

  </div>


  <script
    type="module"
    src="./main.js"
  ></script>

</body>
</html>
