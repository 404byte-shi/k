<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>For Her — 20 ❤️</title>

  <link rel="stylesheet" href="./style.css" />

  <!-- Three.js -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
      }
    }
  </script>
</head>

<body>

  <div id="app"></div>

  <!-- UI -->
  <div class="hud">

    <header>
      <div class="brand">
        FOR HER · 20
      </div>

      <div id="chapter">
        01 · THE UNIVERSE
      </div>
    </header>

    <button id="back" class="glass back">
      ← Back
    </button>

    <section class="story">

      <div id="eyebrow">
        A LITTLE UNIVERSE
      </div>

      <h1 id="title">
        Find HER.
      </h1>

      <p id="description">
        A brighter little universe made for the girl
        who turns distance into something beautiful.
      </p>

      <button id="action" class="glass primary">
        Begin the journey ✦
      </button>

    </section>

    <div id="hint" class="hint">
      Drag · pinch · tap objects
    </div>

    <div id="toast" class="toast"></div>

    <div id="emote" class="emote"></div>

  </div>

  <script type="module" src="./main.js"></script>

</body>
</html>
